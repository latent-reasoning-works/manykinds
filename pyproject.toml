[project]
name = "manykinds"
version = "0.1.1"
description = "Typed data-kind vocabulary — a structural Kind protocol plus xarray/numpy kinds — shared across the latent-reasoning stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "César Miguel Valdez Córdova", email = "cesar.valdez@mila.quebec" },
    { name = "Zack Warren" },
]
keywords = ["typed-data", "protocol", "xarray", "single-cell", "kinds"]
dependencies = [
    "numpy>=1.23",
    "xarray>=2024.0",
    "zarr>=2.18",
    "sparse>=0.15",
    # sparse pulls numba transitively; without a floor the resolver backtracks to
    # numba 0.53 / llvmlite 0.36.0, which ships no py3.11+ wheels and fails to build
    # from source. A modern numba floor keeps the closure installable on 3.11/3.12.
    "numba>=0.60",
]

[project.optional-dependencies]
# Table persistence (parquet) needs a pandas parquet engine.
table = ["pyarrow>=14"]
dev = ["pytest>=7.0", "scipy>=1.10", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/latent-reasoning-works/manykinds"
Repository = "https://github.com/latent-reasoning-works/manykinds"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manykinds"]

[tool.pytest.ini_options]
pythonpath = ["."]
